server:
  port: 8081

spring:
  application:
    name: dc-server-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.59.101:5432/dc_server_db}
    username: ${SPRING_DATASOURCE_USERNAME:dcasset}
    password: ${SPRING_DATASOURCE_PASSWORD:dcasset123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
