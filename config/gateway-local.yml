# 本地开发覆盖：不依赖 Nacos 配置中心，Redis 指向本机
# 含 IDC 业务路由与配件中心路由
spring:
  main:
    allow-circular-references: true
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: openapi
              uri: lb://pig-gateway
              predicates:
                - Path=/v3/api-docs/**
              filters:
                - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/$\{path}/v3/api-docs
            - id: pig-auth
              uri: lb://pig-auth
              predicates:
                - Path=/auth/**
            - id: pig-upms-biz
              uri: lb://pig-upms-biz
              predicates:
                - Path=/admin/**
              metadata:
                response-timeout: 30000
            - id: pig-dc-server-biz
              uri: lb://pig-dc-server-biz
              predicates:
                - Path=/api/servers/**,/api/server-types/**,/api/cpu-architectures/**
              metadata:
                response-timeout: 30000
            - id: pig-dc-accessory-biz
              uri: lb://pig-dc-accessory-biz
              predicates:
                - Path=/api/accessories/**,/api/server-accessories/**,/api/statistics/**,/api/spare-parts/**,/api/spare-part-categories/**,/api/accessory-center/**
              metadata:
                response-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
