services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/java:1-17-bookworm
    container_name: dc-devcontainer
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      SPRING_DATASOURCE_USERNAME: dcasset
      SPRING_DATASOURCE_PASSWORD: dcasset123
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - dc-network

  postgres:
    ports:
      - "5432:5432"

  nacos:
    ports:
      - "8848:8848"
      - "9848:9848"

  dc-server-service:
    profiles:
      - production

  dc-accessory-service:
    profiles:
      - production

  dc-gateway:
    profiles:
      - production

  frontend:
    profiles:
      - production
