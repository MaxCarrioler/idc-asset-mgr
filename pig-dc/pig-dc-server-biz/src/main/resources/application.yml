server:
  port: 8081

spring:
  application:
    name: pig-dc-server-biz
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    gateway:
      server:
        webflux:
          enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.59.101:5432/dc_server_db}
    username: ${SPRING_DATASOURCE_USERNAME:dcasset}
    password: ${SPRING_DATASOURCE_PASSWORD:dcasset123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  autoconfigure:
    exclude:
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.pig4cloud.pig.common.data.mybatis.MybatisPlusConfiguration

security:
  oauth2:
    client:
      ignore-urls:
        - /actuator/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
