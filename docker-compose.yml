services:
  postgres:
    image: postgres:18-alpine
    container_name: dc-postgres
    environment:
      POSTGRES_USER: dcasset
      POSTGRES_PASSWORD: dcasset123
      POSTGRES_DB: idc_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcasset -d idc_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dc-network

  backend:
    build:
      context: ..
      dockerfile: IDC-Manager/docker/Dockerfile.backend
    container_name: dc-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: idc_manager
      DB_USER: dcasset
      DB_PASSWORD: dcasset123
      JWT_SECRET: ${JWT_SECRET:-idc-manager-jwt-secret-key-please-change-in-production-env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dc-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - dc-network

volumes:
  postgres_data:

networks:
  dc-network:
    driver: bridge
